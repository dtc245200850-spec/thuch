<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <title>Liên kết trong HTML</title>
    </head>
    <body>
        <h1>Liên kết yêu thích của tôi</h1>

        <ul>
            <!-- 3 liên kết đến các trang web khác nhau -->
            <li><a href="https://www.google.com">Trang chủ Google</a></li>
            <li><a href="https://www.youtube.com">Trang chủ YouTube</a></li>
            <li><a href="https://github.com">Trang chủ GitHub</a></li>

            <!-- Liên kết mở trong tab mới với target="_blank" -->
            <li><a href="https://www.wikipedia.org" target="_blank">Trang Wikipedia (mở trong tab mới)</a></li>

            <!-- Liên kết đến file about.html trong cùng thư mục -->
            <li><a href="about.html">Xem trang Giới thiệu (about.html)</a></li>

            <!-- Liên kết mở ứng dụng gửi email với mailto: -->
            <li><a href="mailto:ban@example.com">Gửi email cho tôi</a></li>
        </ul>
    </body>
</html>
